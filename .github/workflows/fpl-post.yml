name: Build FPL post

on:
  schedule:
    # Times are UTC. Shaped around when posts actually go out rather than
    # hammering the scheduler round the clock: ~19 runs a day instead of 48,
    # with no slot ever seeing a page more than 30 minutes old.
    - cron: "0,30 8-13 * * *"   # FPL locks gameweeks at 9am UK (08:00 or 09:00
                                # UTC), so poll every 30 min across that window
                                # and the late posting slots
    - cron: "0 4-7,14 * * *"    # hourly over the earlier posting slots
    # Nothing outside 04:00-14:30 UTC, which is the 12pm-10.30pm MYT posting
    # window. No post can go out then, so a build would be wasted work. The
    # daily commits still count as activity for GitHub's 60 day idle cutoff.
  workflow_dispatch:        # the "Run workflow" button, for testing

permissions:
  contents: write

concurrency:
  group: fpl-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Generate the post
        env:
          FPL_LEAGUE_ID: "220903"
          FPL_LEAGUE_NICK: "Legends"
        run: python fpl_post.py --all

      - name: Publish
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "post: $(date -u +'%Y-%m-%d %H:%M')"
          git push
